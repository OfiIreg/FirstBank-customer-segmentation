# docker-compose.yml
# Multi-container setup for the FirstBank Cross-Sell Propensity system
# (Final Project technical requirement). Three services:
#   pipeline  - runs the Module 3 ETL DAG on a schedule (data refresh)
#   api       - serves the Module 4 model via FastAPI, with the Explanation Store
#   dashboard - serves the Module 5 Streamlit stakeholder dashboard
#
# Run locally with:
#   docker compose up --build
#
# api will be reachable at http://localhost:8000
# dashboard will be reachable at http://localhost:8501

version: "3.9"

services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    container_name: firstbank-pipeline
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./great_expectations:/app/great_expectations
    command: python src/pipeline/pipeline_dag.py
    restart: "no"  # one-shot batch job; orchestrate scheduling via the GitHub Actions cron job

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: firstbank-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./monitoring/logs:/app/monitoring/logs
    depends_on:
      - pipeline
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: firstbank-dashboard
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped

  monitoring:
    build:
      context: .
      dockerfile: Dockerfile.monitoring
    container_name: firstbank-monitoring
    volumes:
      - ./data:/app/data:ro
      - ./monitoring:/app/monitoring
    command: python monitoring/run_drift_check.py
    depends_on:
      - api
    restart: "no"  # one-shot report generation; scheduled via CI cron, see .github/workflows/monitoring.yml

networks:
  default:
    name: firstbank-network
