version: "3.9"

services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    container_name: firstbank-pipeline
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./great_expectations:/app/great_expectations
    command: python src/pipeline/pipeline_dag.py
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: firstbank-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./monitoring/logs:/app/monitoring/logs
    depends_on:
      - pipeline
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: firstbank-dashboard
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped

  monitoring:
    build:
      context: .
      dockerfile: Dockerfile.monitoring
    container_name: firstbank-monitoring
    volumes:
      - ./data:/app/data:ro
      - ./monitoring:/app/monitoring
    command: python monitoring/run_drift_check.py
    depends_on:
      - api
    restart: "no"

networks:
  default:
    name: firstbank-network
